server:
  port: ${SPRING_SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rental_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      pool-name: HikariPool-1
      minimum-idle: ${DATASOURCE_MINIMUM_IDLE:5}
      maximum-pool-size: ${DATASOURCE_MAXIMUM_POOL_SIZE:20}
      idle-timeout: ${DATASOURCE_IDLE_TIMEOUT:300000}
      max-lifetime: ${DATASOURCE_MAX_LIFETIME:1800000}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT:30000}
      leak-detection-threshold: ${DATASOURCE_LEAK_DETECTION_THRESHOLD:60000}
      auto-commit: ${DATASOURCE_AUTO_COMMIT:true}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  application:
    name: auth-service

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    ttl-seconds: ${SECURITY_JWT_TTL_SECONDS}
